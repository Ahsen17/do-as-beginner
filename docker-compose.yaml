name: signoz-otel-stack

services:
  zookeeper:
    image: bitnami/zookeeper:3.7.1
    container_name: signoz-zookeeper
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - observability

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.2.23
    container_name: signoz-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=signoz_traces
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=Signoz@123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./assets/otel-config/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otel-collector-config.yaml
    configs:
      - source: otel_collector_config
        target: /etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "13133:13133"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - observability

  otel-collector-migrator:
    image: signoz/signoz-schema-migrator:0.88.1
    container_name: otel-collector-migrator
    restart: "no"
    command:
      - "--dsn=tcp://clickhouse:9000?username=default&password=Signoz@123"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - observability

  signoz-query-service:
    image: signoz/query-service:0.35.0
    container_name: signoz-query-service
    restart: unless-stopped
    environment:
      - SIGNOZ_ENABLE_REGISTRATION=true
      - ClickHouseUrl=tcp://clickhouse:9000?username=default&password=Signoz@123
      - ClickHouseDatabase=signoz_traces
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - ALERTMANAGER_API_PREFIX=http://alertmanager:9093/api/
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
    volumes:
      - ./data/signoz:/var/lib/signoz
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - observability

  signoz-frontend:
    image: signoz/frontend:0.35.0
    container_name: signoz-frontend
    restart: unless-stopped
    environment:
      - FRONTEND_API_ENDPOINT=http://signoz-query-service:8080
    ports:
      - "3301:3301"
    volumes:
      - ./assets/otel-config/nginx-config.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - signoz-query-service
    networks:
      - observability

  alertmanager:
    image: signoz/alertmanager:0.23.4
    container_name: signoz-alertmanager
    restart: unless-stopped
    volumes:
      - ./data/alertmanager:/data
    ports:
      - "9093:9093"
    command:
      - --queryService.url=http://signoz-query-service:8085
      - --storage.path=/data
    networks:
      - observability

configs:
  otel_collector_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:
          send_batch_size: 1000
          timeout: 10s
        
        memory_limiter:
          check_interval: 5s
          limit_mib: 512

      exporters:
        clickhouse:
          endpoint: tcp://clickhouse:9000
          database: signoz_traces
          username: default
          password: "Signoz@123"
          ttl: 72h
        
        logging:
          verbosity: normal

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [clickhouse, logging]
          
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [clickhouse, logging]
          
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [clickhouse, logging]

networks:
  observability:
    driver: bridge
    name: observability-network