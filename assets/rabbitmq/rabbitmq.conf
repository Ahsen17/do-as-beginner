definitions.skip_if_unchanged = true
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# RabbitMQ 4 blocks transient non-exclusive queues by default (deprecated
# feature). Celery/kombu still declares some (pidbox/event/reply queues), so
# permit the feature to keep the worker functioning.
deprecated_features.permit.transient_nonexcl_queues = true
